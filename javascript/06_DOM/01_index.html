<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PARENT CHILDREN AND  BASICS OF DOM</title>
    </head>
    <body style="background-color: black; color: white;">
        <div class="parent" >
            <div class="day">Monday</div>
            <div class="day">Tuesday</div>
            <div class="day">Wednesday</div>
            <div class="day">Thursday</div>
            <div class="day">Friday</div>
        </div>
    </body>
    <script>
        const parent = document.querySelector(".parent")
        console.log(parent)                    // everything inside the parent class
        console.log(parent.children)// shows all the children in html collection, all the other divs and elemnts like h1 and p and span etc
        console.log(parent.children[2])        // "<div class="day">Wednesday</div>"  
        console.log(parent.children[4].innerText)                         // firday

        for (let i = 0; i < parent.children.length; i++) {              // parent.children provides html collection similar to array
            console.log(parent.children[i].innerText);
            let a = Math.floor(Math.random()*255)
            let b = Math.floor(Math.random()*255)
            let c = Math.floor(Math.random()*255)
            parent.children[i].style.color = `rgb(${a},${b},${c})`
            
        }
        console.log(parent.firstElementChild)
        console.log(parent.lastElementChild)
        const day1 = document.querySelector(".day")           // only selects the first class in sequence
        console.log(day1)
        console.log(day1.parentElement)          // access to parent
        console.log(day1.nextElementSibling)              // next sibling


        
    </script>
</html>
