<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Digital CL0CK</title>
        <style>
            .center{
                height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                font-family: sans-serif;
            }
            #clock{
                margin-top: 30px;
                height: 30px;
                border-radius: 10px;
                width: 200px;
                background-color: rgb(21, 21, 80);
                display: flex;
                align-items: center;
                justify-content: center;
            }
        </style>
    </head>
    <body style="background-color: black;color: whitesmoke;">
        <div class="center">
            <div id="banner"><span>Your Local Time</span></div>
            <div id="clock"></div>
        </div>
    </body>
    <script>
        const clock = document.querySelector("#clock")
        setInterval(function(){
            let date = new Date()
            clock.innerHTML = date.toLocaleTimeString();
        },1000);
    </script>
</html>
