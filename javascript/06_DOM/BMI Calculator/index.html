<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BMI CALCULATOR</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <h1>BMI Calculator</h1>
            <form >
                    <div class="fill"style="display: flex;flex-direction: column;align-items: center;">
                        <p><label>Weight (in kg) : </label><input type="text" placeholder="Weight" id="Weight"></p>
                        <p><label>Height (in cm) : </label><input type="text" placeholder="Height" id="Height"></p>
                        <button style="margin: 20px; height: 30px; width: 100px;font-family: sans-serif;font-size: larger;">Calculate</button> 
                    </div>
                    <div id="results"></div>
                    <h3 style="margin-left: 10px;">BMI weight guide</h3>
                    <p>Under Weight  = Less than 18.6</p>
                    <p>Normal Range  = Between 18.6 and 24.9</p>
                    <p>Over Weight  = More than 24.9</p>
                </form>
                
        </div>
    </body>
    <script>
        const form = document.querySelector("form")
        form.addEventListener('submit',function(e){
            e.preventDefault()
            // because form sends the url to some other address , so here we are preventing it
            const height = parseInt(document.querySelector("#Height").value)
            const weight = parseInt(document.querySelector("#Weight").value)
            const result = document.querySelector("#results")
            
            if(height === "" || height<=0 || isNaN(height)){
                result.innerHTML = "Enter a valid height"
            } else if(weight === "" || weight<=0 || isNaN(weight)){
                result.innerHTML = "Enter a valid weight"
            } else{
                const BMI = ((weight)/((height*height)/10000)).toFixed(2)
                if(BMI<18.6) result.style.color = "Yellow"
                else if(BMI>24.9) result.style.color = "Red"
                else result.style.color = "Green"
                result.innerHTML = `<span>BMI = ${BMI}</span>`
            }
        })
    </script>
</html>
